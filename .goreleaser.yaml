version: 2

project_name: hostim

before:
  hooks:
    - go mod tidy

builds:
  - id: hostim
    main: .
    binary: hostim
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/hostimdev/cli/internal/cmd.version={{.Version}}

# One macOS binary for both chips, for the MCPB bundle (an MCPB bundle can pick
# a binary per OS but not per architecture). The per-arch darwin archives stay,
# install.sh downloads those.
universal_binaries:
  - replace: false

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

# Image for the MCP registry, which lists stdio servers by package, not by a
# bare binary. The label in the Dockerfile proves ownership of the server name.
dockers_v2:
  - images: [ghcr.io/hostimdev/cli]
    tags: ["{{ .Tag }}", latest]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  # Show only the change description — no commit hash, no author/email.
  # GoReleaser adds the "* " bullet itself, so the format is message-only.
  abbrev: -1
  format: "{{ .Message }}"
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci"
      - "merge conflict"

# Homebrew publishing is deferred until the tap repo + token exist. Add a
# `homebrew_casks:` block (goreleaser v2's current syntax) when ready to ship it.

release:
  # Publish immediately so users can always grab the latest binary. The CLI is
  # beta, so tag pre-1.0 releases as pre-releases automatically.
  draft: false
  prerelease: auto
