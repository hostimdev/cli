server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Behind the ingress nginx sees plain HTTP: keep redirects relative so
    # /about -> /about/ stays on https.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml application/rss+xml application/atom+xml image/svg+xml;

    location / {
        # $uri.html serves Next.js static export routes (/about -> about.html).
        try_files $uri $uri.html $uri/ =404;
    }

    # Content-hashed asset folders of Astro, Next.js and Docusaurus.
    location ~ ^/(_astro|_next/static|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
